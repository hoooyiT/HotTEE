<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TEE.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF3DE;
    --ink:#1C1712;
    --ramen:#E8890C;
    --pizza:#D93B2B;
    --burger:#4C9A63;
    --theme-bg:#E8890C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
    display:flex; justify-content:center;
    color:var(--ink);
  }
  .pixel-font{ font-family:'Press Start 2P', 'Courier New', monospace; }

  #app{
    width:100%; max-width:540px; min-height:100dvh;
    display:flex; flex-direction:column;
    background:var(--ramen);
    transition:background .25s;
  }

  .pxbtn{
    border:3px solid var(--ink);
    border-radius:8px;
    background:var(--cream);
    box-shadow:0 6px 0 var(--ink);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    transition:transform .06s, box-shadow .06s;
    cursor:pointer;
  }
  .pxbtn:active{ transform:translateY(6px); box-shadow:0 0 0 var(--ink); }

  header{ display:flex; align-items:center; justify-content:space-between; padding:18px 18px 10px; }
  .logo{ padding:8px 12px; background:var(--ink); border:3px solid var(--ink); border-radius:8px; box-shadow:0 6px 0 rgba(0,0,0,0.35); cursor:pointer; appearance:none; }
  .logo span{ color:var(--cream); font-size:15px; letter-spacing:1px; }
  .header-actions{ display:flex; gap:8px; }
  #resetBtn{ width:42px; height:42px; font-size:16px; padding:0; }
  .lang-btn{ width:48px; height:42px; font-size:10px; padding:0; }

  /* ---------- multi-page flow ---------- */
  .progress-dots{ display:flex; gap:6px; justify-content:center; padding:2px 0 12px; }
  .progress-dots span{ width:7px; height:7px; border-radius:50%; background:rgba(28,23,18,0.22); }
  .progress-dots span.active{ background:var(--ink); }

  .page{ display:none; flex-direction:column; padding:0 18px 8px; flex:1; }
  .page.active{ display:flex; }

  .page-title{ font-size:16px; padding:6px 0 8px; line-height:1.4; }
  .page-sub{ font-size:12px; line-height:1.6; color:rgba(28,23,18,0.72); padding-bottom:16px; }

  .theme-grid{ display:flex; flex-direction:column; gap:12px; padding-bottom:18px; }
  .theme-card{
    display:flex; align-items:center; gap:14px; padding:10px 14px;
    background:var(--cream); border:3px solid var(--ink); border-radius:10px;
    box-shadow:0 5px 0 var(--ink); cursor:pointer; transition:transform .06s, box-shadow .06s;
  }
  .theme-card:active{ transform:translateY(5px); box-shadow:0 0 0 var(--ink); }
  .theme-card.selected{ outline:3px dashed var(--ink); outline-offset:3px; }
  .theme-card-icon{ width:50px; height:50px; flex:0 0 auto; }
  .theme-card-label{ font-size:12px; }

  .wide-btn{ width:100%; height:54px; font-size:12px; margin:0 0 14px; }
  .nav-row{ display:flex; gap:10px; padding:8px 0 22px; margin-top:auto; }
  .nav-btn{ flex:1; height:48px; font-size:11px; }
  .nav-btn.primary{ background:var(--ink); color:var(--cream); }

  .preview-frame{
    width:100%; aspect-ratio:1/1.05; border-radius:14px; overflow:hidden;
    display:flex; align-items:center; justify-content:center; margin-bottom:14px;
  }
  .preview-canvas{ width:100%; height:100%; border:3px solid var(--ink); border-radius:14px; box-shadow:0 6px 0 var(--ink); }
  .preview-loading{ font-size:11px; text-align:center; }
  .make-shirt-msg{ font-size:11px; text-align:center; padding:8px 0 2px; min-height:16px; line-height:1.6; }

  .tabs{ display:flex; gap:10px; padding:6px 18px 16px; }
  .tab{
    flex:1; height:52px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    font-size:11px; font-weight:800;
    background:rgba(28,23,18,0.18);
    border:3px solid var(--ink); border-radius:8px;
    box-shadow:0 5px 0 rgba(28,23,18,0.28);
    color:rgba(28,23,18,0.55);
  }
  .tab.active{ background:var(--cream); box-shadow:0 5px 0 var(--ink); color:var(--ink); }
  .tab .tab-icon{ width:22px; height:22px; }

  .stage{ padding:0 8px 6px; position:relative; }
  .canvas{ position:relative; aspect-ratio:1/1.05; touch-action:none; }
  .tee-icon{ position:absolute; inset:6% 4%; width:92%; height:92%; }
  .tee-icon img{ width:100%; height:100%; object-fit:contain; image-rendering:pixelated; filter:drop-shadow(0 10px 14px rgba(0,0,0,0.22)); }

  .sticker{ position:absolute; width:72px; height:72px; left:50%; top:50%; touch-action:none; user-select:none; }
  .sticker svg{ width:100%; height:100%; display:block; cursor:grab; }
  .sticker.is-base{ width:132px; height:132px; }
  .select-ring{ position:absolute; inset:-6px; border:3px dashed var(--ink); border-radius:14px; opacity:0; pointer-events:none; }
  .sticker.selected .select-ring{ opacity:0.55; }

  .handle{
    position:absolute; width:26px; height:26px;
    border:3px solid var(--ink); border-radius:6px; box-shadow:0 3px 0 var(--ink);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:var(--ink);
  }
  .handle.del{ top:-14px; left:-14px; background:#EFA8A0; }
  .handle.resize{ bottom:-14px; right:-14px; background:var(--cream); cursor:nwse-resize; }

  .tray-section{ padding:6px 0 10px; }
  .tray-label{ padding:0 18px 10px; font-size:12px; letter-spacing:1px; color:rgba(28,23,18,0.75); }
  .tray-scroll{ display:flex; gap:12px; overflow-x:auto; padding:2px 18px 8px; scrollbar-width:none; }
  .tray-scroll::-webkit-scrollbar{ display:none; }
  .tray-scroll.base-row{ padding-bottom:4px; }
  .chip{ flex:0 0 auto; width:62px; display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:none; }
  .chip-circle{ width:58px; height:58px; padding:9px; }
  .chip-circle svg{ width:100%; height:100%; }
  .chip.base-chip .chip-circle{ background:var(--ink); }
  .chip.base-chip .chip-circle svg{ filter:brightness(1.15); }
  .chip-label{ font-size:10px; font-weight:700; text-align:center; line-height:1.2; color:var(--ink); }

  .divider{ height:3px; background:rgba(28,23,18,0.15); margin:2px 18px 10px; border-radius:2px; }

  footer{ margin-top:auto; padding:8px 18px 22px; text-align:center; font-size:10px; color:rgba(28,23,18,0.5); }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="logo pixel-font" id="logoBtn" title="返回首頁"><span>TEE.</span></button>
    <div class="header-actions">
      <button class="pxbtn lang-btn pixel-font" id="langBtn">EN</button>
      <button class="pxbtn" id="resetBtn" title="清空重做">↺</button>
    </div>
  </header>

  <div class="progress-dots" id="progressDots"></div>

  <!-- ① WELCOME -->
  <div class="page" id="page-welcome">
    <div class="page-title pixel-font" id="txt-welcomeTitle"></div>
    <div class="page-sub" id="txt-welcomeSub"></div>
    <div class="theme-grid" id="themeGrid"></div>
    <button class="pxbtn wide-btn pixel-font" id="startBtn"></button>
  </div>

  <!-- ② BASE -->
  <div class="page" id="page-base">
    <div class="page-title pixel-font" id="txt-baseTitle"></div>
    <div class="page-sub" id="txt-baseSub"></div>
    <div class="stage" id="stageBase">
      <div class="canvas" id="canvas">
        <div class="tee-icon"><img id="teeImg" src="" alt="T-shirt"></div>
      </div>
    </div>
    <div class="tray-section">
      <div class="tray-label pixel-font" id="baseLabel">底</div>
      <div class="tray-scroll base-row" id="trayBase"></div>
    </div>
    <div class="nav-row">
      <button class="pxbtn nav-btn pixel-font" id="baseBackBtn"></button>
      <button class="pxbtn nav-btn primary pixel-font" id="baseNextBtn"></button>
    </div>
  </div>

  <!-- ③ TOPPINGS -->
  <div class="page" id="page-toppings">
    <div class="page-title pixel-font" id="txt-toppingsTitle"></div>
    <div class="page-sub" id="txt-toppingsSub"></div>
    <div class="stage" id="stageToppings"></div>
    <div class="tray-section">
      <div class="tray-label pixel-font" id="toppingsLabel">PICK ME</div>
      <div class="tray-scroll" id="trayTop"></div>
    </div>
    <div class="nav-row">
      <button class="pxbtn nav-btn pixel-font" id="toppingsBackBtn"></button>
      <button class="pxbtn nav-btn primary pixel-font" id="toppingsNextBtn"></button>
    </div>
  </div>

  <!-- ④ PREVIEW -->
  <div class="page" id="page-preview">
    <div class="page-title pixel-font" id="txt-previewTitle"></div>
    <div class="preview-frame" id="previewFrame"></div>
    <button class="pxbtn wide-btn pixel-font" id="downloadBtn"></button>
    <div class="nav-row">
      <button class="pxbtn nav-btn pixel-font" id="previewBackBtn"></button>
      <button class="pxbtn nav-btn primary pixel-font" id="previewNextBtn"></button>
    </div>
  </div>

  <!-- ⑤ COMPLETE -->
  <div class="page" id="page-complete">
    <div class="page-title pixel-font" id="txt-completeTitle"></div>
    <div class="page-sub" id="txt-completeSub"></div>
    <div class="preview-frame" id="completeFrame"></div>
    <button class="pxbtn wide-btn pixel-font" id="makeShirtBtn"></button>
    <div class="make-shirt-msg" id="makeShirtMsg"></div>
    <button class="pxbtn nav-btn pixel-font" id="startOverBtn"></button>
  </div>

  <footer id="footerText">Prototype · pixel 素材待插畫師出正式圖後替換</footer>
</div>

/* ===================== Pixel-art generator ===================== */
function ellipseMask(n,cx,cy,rx,ry){
  const g=[];
  for(let y=0;y<n;y++){const row=[];for(let x=0;x<n;x++){
    const dx=(x+0.5-cx)/rx, dy=(y+0.5-cy)/ry;
    row.push(dx*dx+dy*dy<=1);
  } g.push(row);} return g;
}
function ringMask(n,cx,cy,rOut,rIn){
  const outer=ellipseMask(n,cx,cy,rOut,rOut), inner=ellipseMask(n,cx,cy,rIn,rIn);
  return outer.map((row,y)=>row.map((v,x)=> v && !inner[y][x]));
}
function unionMask(...ms){ return ms[0].map((row,y)=>row.map((v,x)=> ms.some(m=>m[y][x]))); }
function shadedFill(n,mask,base,shadow){
  let minY=n,maxY=0;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++) if(mask[y][x]){ if(y<minY)minY=y; if(y>maxY)maxY=y; }
  const thresh = minY + (maxY-minY)*0.6;
  const g=Array.from({length:n},()=>Array(n).fill(null));
  for(let y=0;y<n;y++)for(let x=0;x<n;x++) if(mask[y][x]) g[y][x]= y>=thresh?shadow:base;
  return g;
}
function stampDots(grid,dots,color){ dots.forEach(([x,y])=>{ if(grid[y] && grid[y][x]!==undefined) grid[y][x]=color; }); }
function addOutline(n,grid){
  const out = grid.map(r=>r.slice());
  const N=[[1,0],[-1,0],[0,1],[0,-1]];
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    if(grid[y][x]) continue;
    if(N.some(([dx,dy])=>{const nx=x+dx,ny=y+dy; return nx>=0&&nx<n&&ny>=0&&ny<n&&grid[ny][nx];})) out[y][x]='#1C1712';
  }
  return out;
}
function renderGrid(grid,n){
  let rects='';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const c=grid[y][x];
    if(c) rects+=`<rect x="${x}" y="${y}" width="1.05" height="1.05" fill="${c}"/>`;
  }
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
}
function scale2x(grid){
  const n=grid.length;
  const out=Array.from({length:n*2},()=>Array(n*2).fill(null));
  for(let y=0;y<n;y++){
    for(let x=0;x<n;x++){
      const E=grid[y][x];
      const B=y>0?grid[y-1][x]:E;
      const H=y<n-1?grid[y+1][x]:E;
      const D=x>0?grid[y][x-1]:E;
      const F=x<n-1?grid[y][x+1]:E;
      let E0=E,E1=E,E2=E,E3=E;
      if(D===B && D!==H && B!==F) E0=D;
      if(B===F && B!==D && F!==H) E1=F;
      if(D===H && D!==B && H!==F) E2=D;
      if(H===F && H!==D && F!==B) E3=F;
      out[2*y][2*x]=E0;
      out[2*y][2*x+1]=E1;
      out[2*y+1][2*x]=E2;
      out[2*y+1][2*x+1]=E3;
    }
  }
  return out;
}
function buildIcon(n, layers){
  let grid = Array.from({length:n},()=>Array(n).fill(null));
  layers.forEach(L=>{
    const shaded = shadedFill(n, L.mask, L.base, L.shadow);
    for(let y=0;y<n;y++)for(let x=0;x<n;x++) if(shaded[y][x]) grid[y][x]=shaded[y][x];
    if(L.dots) stampDots(grid, L.dots, L.dotColor);
  });
  grid = addOutline(n, grid);
  grid = scale2x(grid); n = n*2;
  return renderGrid(grid, n);
}
function darken(hex,f=0.7){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const d=v=>Math.max(0,Math.min(255,Math.round(v*f)));
  const h=v=>v.toString(16).padStart(2,'0');
  return '#'+h(d(r))+h(d(g))+h(d(b));
}

const N=16, NB=22;

/* ---------- generic templates ---------- */
function tplDisc(n,color,rx,ry){ const cx=n/2,cy=n/2; return {mask:ellipseMask(n,cx,cy,rx,ry), base:color, shadow:darken(color)}; }
function tplRing(n,color,rOut,rIn){ const cx=n/2,cy=n/2; return {mask:ringMask(n,cx,cy,rOut,rIn), base:color, shadow:darken(color)}; }
function tplBlob(n,color){ const cx=n/2,cy=n/2;
  return {mask:unionMask(ellipseMask(n,cx-1.4,cy+1,4,3),ellipseMask(n,cx+1.6,cy-1,3.6,3.2)), base:color, shadow:darken(color)}; }
function tplStrip(n,color){ const cx=n/2,cy=n/2; return {mask:ellipseMask(n,cx,cy,7,2.8), base:color, shadow:darken(color)}; }
function tplCluster(n,color,count,small){
  const cx=n/2, cy=n/2;
  const offs=[[-3,-2],[2,-3],[-1,2],[3,1],[-4,1],[0,-4],[4,-1],[-2,3]];
  const r = small?0.9:1.6;
  const masks = offs.slice(0,count||4).map(([dx,dy])=>ellipseMask(n,cx+dx,cy+dy,r,r));
  return {mask:unionMask(...masks), base:color, shadow:darken(color)};
}
function buildSimple(spec){
  const n = spec.big?NB:N;
  if(spec.shape==='cluster') return buildIcon(n,[tplCluster(n,spec.color,spec.count,spec.small)]);
  if(spec.shape==='ring') return buildIcon(n,[tplRing(n,spec.color,spec.rOut||6,spec.rIn||3.2)]);
  if(spec.shape==='blob') return buildIcon(n,[tplBlob(n,spec.color)]);
  if(spec.shape==='strip') return buildIcon(n,[tplStrip(n,spec.color)]);
  return buildIcon(n,[tplDisc(n,spec.color,spec.small?4.6:6,spec.small?4.2:5.5)]);
}
function makeBowlIcon(fill){
  return buildIcon(NB,[
    {mask:ringMask(NB,11,11,10,7.6), base:'#5FA890', shadow:'#3E7A66'},
    {mask:ellipseMask(NB,11,12.5,7,5.8), base:fill, shadow:darken(fill)},
  ]);
}

function addSticker(refId,isBase){
  const s={ uid:'s'+(zCounter++), refId, x:40+Math.random()*20, y:32+Math.random()*25, scale:isBase?1.4:1, rot:(Math.random()*24-12), z:++zCounter, isBase };
  designs[currentTheme].push(s); selectedId=s.uid; renderCanvas();
}
function deleteSticker(uid){
  designs[currentTheme]=designs[currentTheme].filter(s=>s.uid!==uid);
  if(selectedId===uid) selectedId=null;
  renderCanvas();
}
function selectSticker(s){ selectedId=s.uid; s.z=++zCounter; renderCanvas(); }

function renderCanvas(){
  canvasEl.querySelectorAll('.sticker').forEach(n=>n.remove());
  designs[currentTheme].forEach(s=>{
    const el=document.createElement('div');
    el.className='sticker'+(s.uid===selectedId?' selected':'')+(s.isBase?' is-base':'');
    el.style.left=s.x+'%'; el.style.top=s.y+'%'; el.style.zIndex=s.z;
    el.style.transform=`translate(-50%,-50%) rotate(${s.rot}deg) scale(${s.scale})`;

    const ring=document.createElement('div'); ring.className='select-ring'; el.appendChild(ring);
    const svgWrap=document.createElement('div');
    svgWrap.innerHTML=ICONS[s.refId];
    svgWrap.style.width='100%'; svgWrap.style.height='100%';
    el.appendChild(svgWrap);
    svgWrap.addEventListener('pointerdown',(e)=>startDrag(e,s));

    if(s.uid===selectedId){
      const del=document.createElement('div');
      del.className='handle del'; del.textContent='×';
      del.style.transform=`scale(${1/s.scale})`;
      del.addEventListener('pointerdown',(e)=>{ e.stopPropagation(); deleteSticker(s.uid); });
      el.appendChild(del);

      const rs=document.createElement('div');
      rs.className='handle resize'; rs.textContent='⤢';
      rs.style.transform=`scale(${1/s.scale})`;
      rs.addEventListener('pointerdown',(e)=>startResize(e,s));
      el.appendChild(rs);
    }
    canvasEl.appendChild(el);
  });
}

function startDrag(e,s){
  e.preventDefault(); selectSticker(s);
  const rect=canvasEl.getBoundingClientRect();
  const startX=e.clientX, startY=e.clientY, startPctX=s.x, startPctY=s.y;
  function move(ev){
    const dx=(ev.clientX-startX)/rect.width*100, dy=(ev.clientY-startY)/rect.height*100;
    s.x=Math.min(96,Math.max(4,startPctX+dx));
    s.y=Math.min(96,Math.max(4,startPctY+dy));
    renderCanvas();
  }
  function up(){ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); }
  document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
}
function startResize(e,s){
  e.preventDefault(); e.stopPropagation();
  const rect=canvasEl.getBoundingClientRect();
  const centerX=rect.left+(s.x/100)*rect.width, centerY=rect.top+(s.y/100)*rect.height;
  const startAngle=Math.atan2(e.clientY-centerY,e.clientX-centerX);
  const startDist=Math.hypot(e.clientX-centerX,e.clientY-centerY);
  const startScale=s.scale, startRot=s.rot;
  function move(ev){
    const angle=Math.atan2(ev.clientY-centerY,ev.clientX-centerX);
    const dist=Math.hypot(ev.clientX-centerX,ev.clientY-centerY);
    s.rot=startRot+(angle-startAngle)*180/Math.PI;
    s.scale=Math.min(2.4,Math.max(0.45,startScale*(dist/Math.max(startDist,1))));
    renderCanvas();
  }
  function up(){ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); }
  document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
}
canvasEl.addEventListener('pointerdown',(e)=>{
  if(e.target===canvasEl || e.target.closest('.tee-icon')){ selectedId=null; renderCanvas(); }
});

/* ===================== Export / rendered preview ===================== */
function loadImage(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=src;
  });
}
function loadSvgAsImage(svgMarkup){
  const encoded='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svgMarkup)));
  return loadImage(encoded);
}
async function renderDesignCanvas(theme,size){
  const w=size, h=Math.round(size*1.05);
  const canvas=document.createElement('canvas');
  canvas.width=w; canvas.height=h;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle=THEMES[theme].hex;
  ctx.fillRect(0,0,w,h);
  try{
    const tee=await loadImage(TEE_IMG_SRC);
    ctx.drawImage(tee, w*0.04, h*0.06, w*0.92, h*0.92);
  }catch(e){ /* ignore */ }
  const list=designs[theme].slice().sort((a,b)=>a.z-b.z);
  for(const s of list){
    try{
      const img=await loadSvgAsImage(ICONS[s.refId]);
      const basePx = s.isBase?132:72;
      const drawSize = basePx*(w/540)*s.scale;
      const cx=w*(s.x/100), cy=h*(s.y/100);
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(s.rot*Math.PI/180);
      ctx.drawImage(img, -drawSize/2, -drawSize/2, drawSize, drawSize);
      ctx.restore();
    }catch(e){ /* skip broken sticker */ }
  }
  return canvas;
}
async function showRenderedPreview(containerId){
  const container=document.getElementById(containerId);
  container.innerHTML=`<div class="preview-loading pixel-font">${LANG==='zh'?'渲染緊...':'Rendering...'}</div>`;
  const canvas=await renderDesignCanvas(currentTheme, 720);
  canvas.className='preview-canvas';
  container.innerHTML='';
  container.appendChild(canvas);
}
async function downloadDesignPNG(){
  const btn=document.getElementById('downloadBtn');
  const original=btn.textContent;
  btn.textContent = LANG==='zh'?'處理緊...':'Working...';
  try{
    const canvas=await renderDesignCanvas(currentTheme, 1200);
    canvas.toBlob(blob=>{
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download=currentTheme+'-tee-design.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      btn.textContent=original;
    }, 'image/png');
  }catch(e){
    btn.textContent=original;
  }
}

  document.getElementById('txt-completeTitle').textContent = tr('completeTitle');
  document.getElementById('txt-completeSub').textContent = tr('completeSub');
  document.getElementById('makeShirtBtn').textContent = tr('makeShirt');
  document.getElementById('startOverBtn').textContent = tr('startOver');
  document.getElementById('footerText').textContent = tr('footer');
  buildTray();
  buildWelcomeThemes();
}

/* ===================== Event bindings ===================== */
document.getElementById('logoBtn').onclick=()=>showPage('welcome');
document.getElementById('langBtn').onclick=()=>{
  LANG = LANG==='zh' ? 'en' : 'zh';
  renderChrome();
};
document.getElementById('startBtn').onclick=()=>showPage('base');
document.getElementById('baseBackBtn').onclick=()=>showPage('welcome');
document.getElementById('baseNextBtn').onclick=()=>showPage('toppings');
document.getElementById('toppingsBackBtn').onclick=()=>showPage('base');
document.getElementById('toppingsNextBtn').onclick=()=>showPage('preview');
document.getElementById('previewBackBtn').onclick=()=>showPage('toppings');
document.getElementById('previewNextBtn').onclick=()=>showPage('complete');
document.getElementById('downloadBtn').onclick=()=>downloadDesignPNG();
document.getElementById('makeShirtBtn').onclick=()=>{
  document.getElementById('makeShirtMsg').textContent = tr('makeShirtMsg');
  downloadDesignPNG();
};
document.getElementById('startOverBtn').onclick=()=>{
  designs.ramen=[]; designs.pizza=[]; designs.burger=[];
  selectedId=null; currentTheme='ramen';
  appEl.style.background = THEMES.ramen.hex;
  ensureBase('ramen');
  showPage('welcome');
};

/* ===================== Init ===================== */
appEl.style.background = THEMES[currentTheme].hex;
ensureBase(currentTheme);
buildTray();
renderCanvas();
renderChrome();
showPage('welcome');
</script>
</body>
</html>
